on: [push, pull_request]
name: CI
jobs:
  build:
    name: "Build on Racket"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3.1.0
      - uses: Bogdanp/setup-racket@v1.9.1
        with:
          version: "current"
      - name: Installing guard and its dependencies
        run: raco pkg install --no-docs --auto --name guard
      - name: Compiling guard and building its docs
        run: raco setup --check-pkg-deps --unused-pkg-deps guard
      - name: Testing guard
        run: raco test -x -p guard
